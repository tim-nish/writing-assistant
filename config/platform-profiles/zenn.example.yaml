# platform-profiles/zenn.example.yaml — Zenn publication profile (Story 16.1).
#
# Copy to the machine-global per-repo profiles directory (NEVER the host repo):
#   dir=$(python3 scripts/resolve-paths.py repo-config-dir --root <host-repo>)
#   cp config/platform-profiles/zenn.example.yaml "$dir/platform-profiles/zenn.yaml"
#
# Packaging only — publishing intent lives in user config's `syndication.policy`.

platform: zenn

# A JA reader differs from an EN canonical draft's audience/language, so
# emission gets exactly one lede re-targeting proposal (です/ます register)
# under the proposal contract (Story 16.5).
audience: ja-practitioner
language: ja

packaging:
  # Zenn frontmatter schema.
  frontmatter: [title, emoji, type, topics, published]
  # Zenn caps topics at 5.
  tag_cap: 5
  tldr_placement: none
  cover: none
  # Zenn is canonical via repo-sync, so a variant carries no canonical_url.
  canonical_url:
    policy: none
  # Zenn renders fenced ```mermaid blocks natively, so a diagram is embedded
  # directly with zero manual work (SPEC-article-visuals CAP-5).
  visuals: mermaid-embedded
  # The Zenn-synced repo's TARGET DIRECTORY layout. This is a CONFORMANCE
  # RECORD of the platform's sync contract, never an authority: the
  # output.drafts destination repo's actual directory structure is
  # authoritative, checked by existence (Story 16.6 lint). The articles repo
  # still owns its stored record schema.
  layout:
    repo: articles
    dir: articles/
    # THE DELIVERED FILENAME IS ZENN'S SLUG (#715). Zenn derives an article's
    # slug from the delivered basename and its rule forbids dots, so the
    # pipeline's own `<slug>.<platform>.md` convention cannot cross this
    # boundary: `articles/` is Zenn's externally imposed delivery target, and
    # this profile is a conformance record of that sync contract. The mapping
    # applies ONLY at delivery — the co-located `drafts/` name is untouched.
    #
    # The delivered basename is the article's PERMANENT identity (its URL).
    # Renaming after first publish forks the article, so decide it before the
    # first `published: true` and treat it as immutable per article afterwards.
    # Zenn derives the published identity from the delivered filename, so an
    # absent `basename` mapping below is a defect rather than the contracted
    # default (#719). Declared here and NOT inferred from `dir:` — `devto/`
    # and `newsletter/` are our own organizational choices and constrain no
    # name, so inferring from the directory would report them falsely.
    identity_from_basename: true
    basename:
      rule: slug-dots-to-hyphens   # tanuki-x.ja + zenn -> tanuki-x-ja
      slug_pattern: '^[a-z0-9_-]{12,50}$'
      # Reported separately so a finding says WHICH way to fix the name.
      slug_charset: '[^a-z0-9_-]'
      slug_min_length: 12
      slug_max_length: 50

distribution_hook: zenn-follow
