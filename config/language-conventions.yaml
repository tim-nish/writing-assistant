# language-conventions.yaml — per-LANGUAGE telling conventions for canonical
# adaptation (SPEC-canonical-adaptation CAP-3/CAP-6, Story 18.56).
#
# The adaptation TARGET is named by pointing at a platform profile
# (`adapt-canonical.py plan --target zenn`): the profile already declares the
# one named reader (`audience`) and that reader's `language`. What a profile
# does NOT declare — and must not, because a profile is packaging-scoped by the
# ratified intent/packaging boundary (2026-07-16) — is how prose is TOLD in
# that language. Register and terminology treatment are properties of the
# language, shared by every target that speaks it, so they are declared once
# here and read as data. No language branch lives in adaptation code (CAP-6).
#
# Adding a second adaptation target is:
#   - one platform profile file (the reader + its language), and
#   - one entry here only if that reader speaks a language not yet declared.
#
# This shipped file is the default. A host may override it per repo with a
# `language-conventions.yaml` in its resolved repo-config directory
# (`resolve-paths.py repo-config-dir`); the override replaces this file whole.

# `title_claim_verb` (added 2026-07-25, #701) declares the review lint's
# claim-verb test for a language: `words` are whole tokens that count as a claim
# verb, `suffixes` are token endings that do. Both are DATA — the checker is
# generic, so no language is a branch in `lint-article` either. The English set
# lived in code until a Japanese title carrying the verb 言わせる was reported as
# "a bare noun phrase" on every run; a check that cannot judge a language must
# say nothing about it, so a language declaring NO `title_claim_verb` is SKIPPED
# and the skip is disclosed (review-prompts.md, Lint checklist). The ≤70-char
# title bound is language-independent and is not declared here.

languages:
  en:
    register: plain contemporary technical English, one register throughout
    terminology: technical terms in their established English form, never invented synonyms
    # NOTE for editors: this file is read by the repo's stdlib YAML SUBSET
    # parser, which supports single-line flow lists and block sequences but NOT
    # a flow list wrapped across lines — one would silently truncate the list
    # and swallow the entries after it. Keep `words` a block sequence.
    title_claim_verb:
      suffixes: [ed, ing]
      words:
        - is
        - are
        - was
        - were
        - be
        - beat
        - beats
        - kill
        - kills
        - cut
        - cuts
        - break
        - breaks
        - broke
        - ship
        - ships
        - find
        - finds
        - fix
        - fixes
        - make
        - makes
        - made
        - turn
        - turns
        - save
        - saves
        - cost
        - costs
        - double
        - doubles
        - triple
        - triples
        - halve
        - halves
        - win
        - wins
        - won
        - fail
        - fails
        - catch
        - catches
        - reduce
        - reduces
        - add
        - adds
        - drop
        - drops
        - speed
        - speeds
        - run
        - runs
        - ran
        - build
        - builds
        - built
        - scale
        - scales
        - boost
        - boosts
        - slash
        - slashes
        - power
        - powers
        - drive
        - drives
        - solve
        - solves
        - handle
        - handles
        - replace
        - replaces
        - why
        - how
        - keep
        - keeps
        - kept
        - let
        - lets
        - give
        - gives
        - gave
        - teach
        - teaches
        - taught
        - prevent
        - prevents
        - avoid
        - avoids
        - enable
        - enables
        - unlock
        - unlocks
        - stop
        - stops
        # Bare-infinitive / imperative forms (#756): an imperative title
        # ("Automate the user, not the code") IS a claim — its verb is the
        # bare infinitive, so the declared set must carry those forms or every
        # imperative-mood title reads as a bare noun phrase.
        - automate
        - use
        - test
        - write
        - read
        - delete
        - remove
        - measure
        - trust
        - treat
        - think
        - start
        - design
        - choose
        - embrace
        - forget
        - review
        - simulate
        - validate
        - verify
        - refactor
        - migrate
        - deploy
        - monitor
        - profile
        - benchmark
        - simplify
        - optimize
        - generate
        - never
        - always
        - don't
        - do
  ja:
    register: です/ます (polite form), consistent throughout, no mixed 常体
    terminology: technical terms kept in English or established katakana, never force-translated
    # No `title_claim_verb`: what should count as a claim verb in a Japanese
    # title (です/ます predicates, する-compounds, plain-form endings) is an open
    # language-data question, and a wrong test is a false positive with extra
    # steps. Until it is authored, JA titles are skipped with disclosure — which
    # is the honest verdict, not a gap being hidden.
