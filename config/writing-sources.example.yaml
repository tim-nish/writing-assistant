# writing-sources.example.yaml — per-host-repo source & output declaration (CAP-2).
#
# Copy to ~/.config/writing-assistant/repos/<repo-key>/writing-sources.yaml —
# machine-global per-repo config, NEVER inside the host repo (#211: a host repo
# may be public, and this file can carry private pointers). Print the exact
# destination with:
#   python3 scripts/resolve-paths.py sources-file --root <host-repo>
# Two things are declared here:
#
#   sources: the ONLY paths the harvest step may read. A repo not listed is
#            never traversed, even if it sits next to this one on disk. Paths
#            resolve against the host-repo root, not the process working dir.
#   output:  where the pipeline writes drafts. There is no fixed `drafts/`
#            default — an absent output key makes the pipeline ask once and
#            offer to write your answer back into this file.

sources:
  - path: .                              # the host repo itself (whole tree in scope)
    # Recommended for a whole-repo scope: add an `include:` allowlist so harvest
    # reads only article material and skips tool/editor/build dirs (.claude/,
    # _bmad/, node_modules/, …). Without it, `path: .` sweeps the whole tree and
    # harvest warns about the noise it pulled in.
    # include: ["specs/**", "docs/**", "README.md"]
  - path: ../research-notes              # a sibling checkout on local disk
    include: ["notes/**", "specs/**"]    # optional: narrow to these globs. Omit = whole path in scope.
    # `include:` must use this INLINE form. A block-style YAML list
    # (`include:` followed by `- "glob"` lines) is a hard error (#221) — the
    # resolver refuses to run rather than silently ignore the allowlist and
    # widen scope to the whole tree.

  # Entries carry an optional `type:` key (Story 13.49). `type: path` is the
  # default — the two entries above are `path` sources and behave exactly as
  # before. Non-file evidence is an explicit opt-in declaration; an unknown
  # `type`, or a key that only applies to another type (`include` on a
  # non-path entry, `labels` outside github-issues), is refused with a
  # per-key error — never silently ignored.
  #
  # - type: github-issues                # harvest the HOST repo's issues (read-only).
  #   labels: ["tanuki:*"]               # optional label filter (inline form, like include).
  #   # Emitted facts carry the issue URL as their SOURCE pointer. The read
  #   # INCLUDES THE ISSUE THREAD — the decision usually lives in the comments,
  #   # so a body-only projection is emitted as a MARKED PARTIAL, never as a
  #   # complete read (#1184).
  # - type: tanuki-den                   # harvest Tanuki's findings ledger (read-only).
  #   # Emitted facts carry a `den:<ledger-id>@<run>` SOURCE pointer.
  # - type: commits                      # the HOST repo's own history (read-only, #1184).
  #   since: "2026-07-01"                # optional bound: any git date or revision.
  #   paths: ["scripts/**", "specs/**"]  # optional path bounds (inline form, like include).
  #   # A commit message is the closest thing a repository has to a native
  #   # EPISODE: a change together with the stated reason for it. Emitted
  #   # material pins to the COMMIT SHA (the bare-sha SOURCE form). Read the
  #   # declared scope with:
  #   #   resolve-writing-sources.py commits --root <host-repo>

  # THE TIME AXIS IS DERIVED FROM THE TYPE AND IS NEVER DECLARED BY HAND
  # (2026-08-01 amendment, #1184). `commits`, `github-issues` and `tanuki-den`
  # carry a time axis; `path` does not — for prose and code alike, because docs
  # and specs describe the latest state of usage rather than how it came to be.
  # A claim about how something CAME TO BE (an `episode` claim) may be grounded
  # ONLY in a time-axis source, and is refused at the ship gate otherwise; a
  # claim about how something CURRENTLY IS is admissible against either class.
  # A hand-written `time_axis:` key is REFUSED at read time, never honoured.
  # See what your own declaration can ground:
  #   resolve-writing-sources.py time-axis --root <host-repo>

output:
  # Draft + platform-variant output directory. Recommended: a directory in a
  # dedicated PRIVATE articles repository OUTSIDE the host repo — articles are
  # private assets, and a maybe-public host repo should never carry them (#213).
  # `~` and absolute paths are supported.
  drafts: ~/work/articles/drafts/
  # In-host alternative (resolves relative to the host-repo root, NOT the cwd):
  # drafts: articles/drafts/

# Optional: let the Stage-2 interview seed tension questions from your
# recorded policy positions. Absent = the interview runs exactly as before.
# This is a PRESENCE TOGGLE only (#366): the assistant holds no filesystem
# path to your policy hub — all policy content is served by the
# tsurezure-gateway MCP server, whose own operator config owns the hub
# location. The read stays bounded IN CODE to GLOSSARY.md, LESSONS.md, and at
# most 2 topics/*.md files — never the hub's history archive, never a write —
# and every run pins the served commit. An unreachable gateway is not a
# config error: the interview logs one line and degrades to generic questions.
# Which topics/*.md files an article reads is chosen PER ARTICLE at draft time
# (draft-article Stage 2 proposes <=2 and the owner approves) — it is not
# config. The former path key was retired (Story 13.73) and the track / topics
# keys were removed (Story 13.36); a leftover key is reported as a named
# configuration error with a migration notice.
# policy_source:
#   enabled: true                        # presence toggle — no path; the gateway owns the hub location
#   # Optional (#525): seed the per-article topic proposal from a track→topic
#   # mapping. Articles-repo TRACK name (the backlog item's `track:` frontmatter,
#   # which the articles repo OWNS) → hub TOPIC name(s). When a draft's backlog
#   # item carries a mapped track, its topics become the default recommendation
#   # for the ≤2-topic proposal (draft-article Stage 2); the owner still
#   # approves/overrides. Absent = intent-driven proposal, exactly as before.
#   # Declared precedence: hub topic files are authoritative — a mapped topic
#   # that names no hub topic file is a config defect (topic-existence lint); a
#   # track absent from all backlog `track:` values is a stale-mapping warning.
#   track_topics:
#     kagamios-lessons: kagamios
#     eval-engineering: benchmark-engineering
#     signature-research: signature-research
#     claude-code-ops: claude-code-ops
